<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                let correct = document.querySelector('.correct');
                correct.addEventListener('click', function (event) {
                    correct.style.backgroundColor = 'green';
                    document.querySelector('#feedback').innerHTML = 'Correct';
                });

                let incorrects = document.querySelectorAll('.incorrect');
                for (let i = 0; i < incorrects.length; i++) {
                    incorrects[i].addEventListener('click', function (event) {
                        incorrects[i].style.backgroundColor = 'red';
                        document.querySelector('#feedback').innerHTML = 'Booooooo, Incorrect!';
                    });
                }

                document.querySelector('.check').addEventListener('click', function (event) {
                    let input = document.querySelector('input');
                    if (input.value === 'Coffee' || input.value === 'coffee') {
                        input.style.backgroundColor = 'green';
                        document.querySelector('#feedback2').innerHTML = 'Correct, Cheers!';
                    } else {
                        input.style.backgroundColor = 'red';
                        document.querySelector('#feedback2').innerHTML = 'Incorrect :(';
                    }
                });
            });
        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <h3>What's the best club in the whole world?</h3>
                <button class="correct">Manchester United</button>
                <button class="incorrect">Arsenal</button>
                <button class="incorrect">Chelsea</button>
                <button class="incorrect">Tottenham</button>
                <p id="feedback"></p>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <h3>What's the best drink ever made?</h3>
                <input type="text">
                <button class='check'>Check Answer</button>
                <p id="feedback2"></p>
            </div>
        </div>
    </body>
</html>
